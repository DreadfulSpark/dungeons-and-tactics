<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0910">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D&amp;T">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Dungeons &amp; Tactics</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1423;--ink2:#241c2e;--ink3:#3a2e45;--amber:#e8a33d;--ember:#c2412d;--teal:#5b8c85;--teal2:#5fd3f0;--bone:#f2e6c9;--mute:#9a90a0;--px:'Press Start 2P',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0910;color:var(--bone);font-family:var(--px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.mute{color:var(--mute)} .teal{color:var(--teal2)} .small{font-size:8px} .star{color:var(--amber);font-weight:400} .gold{color:var(--amber)} .enemy{color:var(--ember)} .left{text-align:left}
.panel{background:rgba(26,20,35,.94);border:3px solid var(--ink3);box-shadow:inset 0 0 0 2px #0c0910,4px 4px 0 rgba(0,0,0,.5);padding:12px;pointer-events:auto}
.btn{font-family:var(--px);font-size:10px;line-height:1.4;color:var(--bone);background:var(--ink3);border:3px solid #4d3e5c;border-bottom-color:#1a1423;border-right-color:#1a1423;padding:9px 11px;cursor:pointer;transition:transform .08s,background .12s,filter .12s;pointer-events:auto;text-align:left;position:relative}
.btn:hover:not(:disabled){background:#4d3e5c;filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(2px) scale(.98)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:#ffc766 #8f5d1a #8f5d1a #ffc766}
.btn.primary:hover:not(:disabled){background:#ffb84d}
.btn.bonus{background:#5a3f8a;border-color:#7a5fb0 #2a1f4a #2a1f4a #7a5fb0}
.btn:disabled{opacity:.38;cursor:default}
.btn.big{font-size:12px;padding:14px 18px;text-align:center}
.btn.tiny{font-size:8px;padding:5px 7px}
.btn.on{outline:3px solid var(--amber)}
.btn .cost{float:right;margin-left:10px;padding:1px 4px;font-size:8px;background:rgba(0,0,0,.35)}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .bonly{display:none}
#hud.battle .bonly{display:block}
#hud:not(.battle) #pops,#hud:not(.battle) #tray,#hud:not(.battle) #unitPanel,#hud:not(.battle) #actions,#hud:not(.battle) #tileInfo{display:none}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
#turnLabel{font-size:10px;color:var(--amber);text-shadow:2px 2px 0 #000;line-height:1.6;display:none}
#hud.battle #turnLabel{display:block}
#topright{display:flex;gap:6px;pointer-events:auto}
#threatBtn{display:none}
#hud.battle #threatBtn{display:block}
#hint{position:fixed;top:44px;left:12px;font-size:9px;color:var(--bone);max-width:340px;line-height:1.8;text-shadow:2px 2px 0 #000}
#unitPanel{position:fixed;top:52px;right:12px;width:260px;max-height:calc(100% - 200px);overflow:auto;font-size:8px;line-height:1.8;transform:translateX(120%);transition:transform .2s ease-out}
#unitPanel.show{transform:none}
#unitPanel h3{margin:0;font-size:11px;font-weight:400;color:var(--teal2)} #unitPanel h3.enemy{color:var(--ember)}
.ph{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.portrait{image-rendering:pixelated;display:block}
.stats .stat{display:flex;justify-content:space-between} .stat b{font-weight:400;color:var(--amber)}
.weap,.perk{margin-top:6px;padding-top:6px;border-top:2px solid var(--ink3)}
.perk.locked{opacity:.45}
#tray{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:auto}
.die{width:58px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--px);font-size:20px;background:var(--bone);color:var(--ink);border:3px solid #fff6e0;border-bottom-color:#a89c80;border-right-color:#a89c80;cursor:pointer;transition:transform .12s;position:relative}
.die small{font-size:7px;margin-top:4px;color:#6b5f4f;max-width:54px;overflow:hidden;white-space:nowrap}
.die.owned{background:#c9e8ee;border-color:#e8fbff #7aa0a8 #7aa0a8 #e8fbff}
.die.sel{transform:translateY(-8px);outline:3px solid var(--amber)}
.die.used{opacity:.3;cursor:default}
.die.star{background:var(--amber)}
.die.rolling{animation:roll .09s linear infinite}
@keyframes roll{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}100%{transform:rotate(-8deg)}}
#endBtn{margin-left:6px}
#actions{position:fixed;right:12px;bottom:96px;display:none;flex-direction:column;gap:4px;min-width:220px;max-height:calc(100% - 330px);overflow:auto}
#actions.show{display:flex;animation:pop .12s ease-out}
.ah{display:flex;justify-content:space-between;align-items:center;font-size:9px;margin-bottom:4px;gap:6px}
.pips i{font-style:normal;font-size:7px;padding:2px 4px;margin-left:3px;background:var(--teal);color:var(--ink)}
.pips i.off{background:#3a2e45;color:var(--mute);text-decoration:line-through}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
#forecast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);width:min(540px,94vw);font-size:8px;line-height:1.8;display:none;text-align:center}
#forecast.show{display:block;animation:pop .12s ease-out}
.fc-title{font-size:10px;margin-bottom:8px} .fc-name{color:var(--amber)} .fc-name.enemy{color:var(--ember)}
.fc-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fc-big{font-size:13px;color:var(--bone)}
.fc-risk{margin-top:8px;color:#e8a080}
.mods{margin-top:6px;color:var(--teal2);font-size:8px} .mods .bad{color:#e07060}
.fc-btns{display:flex;gap:6px;justify-content:center;margin-top:8px}
#banner{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:clamp(18px,4vw,34px);color:var(--amber);text-shadow:4px 4px 0 #000;opacity:0;pointer-events:none;z-index:6}
#banner.enemy{color:var(--ember)} #banner.small{font-size:clamp(14px,3vw,22px);color:#ffd27a}
#banner.go{animation:banner 1.3s ease-in-out}
@keyframes banner{0%{opacity:0;transform:translateX(-30%)}20%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30%)}}
#d20{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);width:92px;height:92px;display:none;align-items:center;justify-content:center;font-size:24px;color:var(--ink);background:var(--amber);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);z-index:6}
#d20.show{display:flex} #d20.miss{background:var(--mute)}
#d20.crit{background:#ffd27a;animation:critpulse .3s ease-out 2}
@keyframes critpulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
#d20label{position:fixed;left:50%;top:calc(28% + 62px);transform:translateX(-50%);font-size:10px;text-shadow:2px 2px 0 #000;display:none;white-space:nowrap;z-index:6}
.pop{position:fixed;font-size:16px;color:var(--bone);text-shadow:3px 3px 0 #000;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%);z-index:4}
.hpbar{position:fixed;width:38px;height:7px;background:#0c0910;border:2px solid #0c0910;transform:translate(-50%,-50%);pointer-events:none}
.hpbar.boss{width:64px;height:9px}
.hpbar i{display:block;height:100%;background:var(--teal2);transition:width .3s}
.hpbar.enemy i{background:var(--ember)}
.hpbar .mv{position:absolute;left:100%;top:-6px;margin-left:4px;font-size:9px;color:var(--amber);font-style:normal;text-shadow:2px 2px 0 #000}
.hpbar .intent{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:3px;font-size:8px;font-weight:400;white-space:nowrap;color:#ffb0a0;text-shadow:2px 2px 0 #000}
#tileInfo{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:250px;font-size:8px;line-height:1.8;display:none}
#tileInfo.show{display:block}
/* ---------- SCREENS ---------- */
#screen{position:fixed;inset:0;display:none;overflow:auto;pointer-events:auto;touch-action:pan-y;z-index:3;padding:max(14px,env(safe-area-inset-top)) 14px 24px}
#screen.show{display:block}
#screen.camp,#screen.runscr{background:rgba(12,9,16,.55)}
#screen h1{font-size:clamp(26px,6vw,52px);font-weight:400;color:var(--amber);text-shadow:5px 5px 0 #000;line-height:1.3;margin:0}
#screen h2{font-size:14px;font-weight:400;color:var(--amber);margin:0 0 6px}
.title-wrap{min-height:90%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.title-wrap .sub{font-size:10px;color:var(--bone);text-shadow:2px 2px 0 #000}
.col{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:240px;margin-top:10px}
.camp,.runmap{max-width:980px;margin:0 auto}
.camp-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.camp-top .gold{font-size:16px;text-shadow:2px 2px 0 #000}
.camp-top .mute{font-size:8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs .descend{margin-left:auto}
.camp-body{background:rgba(26,20,35,.94);border:3px solid var(--ink3);padding:12px;font-size:9px;line-height:1.8}
.sec-t{margin:14px 0 6px;color:var(--amber);font-size:10px} .sec-t:first-child{margin-top:0} .sec-t .mute{font-size:8px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.hcard{display:flex;gap:6px;align-items:center;background:var(--ink2);border:3px solid var(--ink3);padding:6px;cursor:pointer;transition:transform .1s,border-color .1s;font-size:8px}
.hcard:hover{transform:translateY(-2px);border-color:#5a4a6a}
.hcard.inparty{border-color:var(--teal)}
.hcard.empty{justify-content:center;color:var(--mute);min-height:90px;cursor:default;border-style:dashed}
.hcard.tall{align-items:flex-start;cursor:default}
.hc-info{flex:1;min-width:0} .hc-name{font-size:9px;margin-bottom:2px}
.hpline{height:5px;background:#0c0910;margin:4px 0} .hpline i{display:block;height:100%;background:var(--teal2)}
.sgrid{display:grid;grid-template-columns:auto auto auto auto;gap:0 10px;font-size:8px;margin:6px 0} .sgrid b{font-weight:400;color:var(--amber);text-align:right}
.dicerow,.shop{display:flex;flex-wrap:wrap;gap:8px}
.dchip,.sitem{background:var(--ink2);border:2px solid var(--ink3);padding:8px;font-size:8px;min-width:150px;display:flex;flex-direction:column;gap:6px}
.sitem b,.dchip b{font-weight:400}
.faces{display:flex;flex-wrap:wrap;gap:3px} .faces i{font-style:normal;background:var(--bone);color:var(--ink);padding:2px 4px;font-size:8px}
.quest{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px;margin-bottom:6px;background:var(--ink2);border:2px solid var(--ink3)}
.quest.done{opacity:.55} .quest.locked{opacity:.6}
.quest b{font-weight:400;color:var(--bone)}
.codex{margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--ink3)} .codex b{font-weight:400;color:var(--amber)}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0;font-size:8px}
.hd{display:flex;gap:10px;align-items:center;text-align:left}
/* run map */
.map{position:relative;height:min(52vh,420px);background:rgba(26,20,35,.9);border:3px solid var(--ink3);margin-bottom:10px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:#4d3e5c;stroke-width:.6;vector-effect:non-scaling-stroke;stroke-width:3;stroke-dasharray:6 6}
.map line.on{stroke:var(--amber)}
.mnode{position:absolute;transform:translate(-50%,-50%);font-family:var(--px);font-size:8px;padding:8px 6px;min-width:70px;text-align:center;background:var(--ink3);color:var(--bone);border:3px solid #4d3e5c;cursor:default;opacity:.55}
.mnode.avail{opacity:1;cursor:pointer;border-color:var(--amber);animation:glow 1.2s ease-in-out infinite}
.mnode.avail:hover{transform:translate(-50%,-50%) scale(1.08)}
.mnode.done{opacity:.35} .mnode.here{opacity:1;outline:3px solid var(--teal2)}
.mnode.elite{background:#6a2a3a} .mnode.boss,.mnode.rescue{background:var(--ember);font-size:9px} .mnode.treasure{background:#7a5a20} .mnode.campfire{background:#2a5a4a} .mnode.event{background:#3a3a6a}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(232,163,61,.35)}}
.partyline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:8px}
.pmini{display:flex;gap:4px;align-items:center;background:rgba(26,20,35,.94);border:2px solid var(--ink3);padding:4px 6px;min-width:140px}
.pmini.ko{opacity:.45}
.center-panel{max-width:520px;margin:6vh auto;background:rgba(26,20,35,.96);border:3px solid var(--ink3);padding:18px;font-size:9px;line-height:1.9;text-align:center}
.center-panel.wide{max-width:820px}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card{width:220px;min-height:150px;font-family:var(--px);font-size:8px;line-height:1.8;text-align:left;background:var(--ink2);color:var(--bone);border:3px solid #4d3e5c;padding:10px;cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:6px}
.card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--amber)}
.card:disabled{opacity:.45;cursor:default} .card.taken{border-color:var(--teal2);opacity:1}
.card-t{font-size:10px;color:var(--amber)}
.lvup{background:var(--ink2);border:2px solid var(--teal);padding:6px;margin:6px 0;text-align:left;font-size:8px}
.lvup b{font-weight:400;color:var(--amber)}
#modal{position:fixed;inset:0;background:rgba(12,9,16,.75);display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;padding:12px}
#modal.show{display:flex}
#modalBody{max-width:min(560px,94vw);max-height:90vh;overflow:auto;font-size:9px;line-height:1.9;text-align:center;animation:pop .2s ease-out}
#modalBody h2{font-size:14px;font-weight:400;color:var(--amber);margin:0 0 8px}
.mbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);border:3px solid var(--amber);padding:10px 14px;font-family:var(--px);font-size:9px;color:var(--bone);z-index:30;animation:pop .2s ease-out;max-width:90vw;text-align:center}

/* ---------- 3D dice overlay ---------- */
#diceLayer{position:fixed;inset:0;z-index:15;display:none;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(12,9,16,.25),rgba(12,9,16,.72));opacity:0;transition:opacity .2s}
#diceLayer.show{display:block;opacity:1;pointer-events:auto;touch-action:none}
#diceCv{position:absolute;inset:0;width:100%;height:100%}
#diceTitle{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:clamp(10px,2vw,14px);color:var(--bone);text-shadow:3px 3px 0 #000;padding:0 16px}
#dicePrompt{position:absolute;bottom:18%;left:0;right:0;text-align:center;font-size:11px;color:var(--amber);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .2s}
#dicePrompt.show{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#diceResult{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:clamp(16px,4vw,30px);color:var(--bone);text-shadow:4px 4px 0 #000;opacity:0;transform:scale(.7);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.6,1)}
#diceResult.show{opacity:1;transform:none}
#diceResult.crit{color:#ffd27a} #diceResult.miss{color:var(--mute)} #diceResult.hit{color:var(--bone)}
#diceResult small{display:block;font-size:10px;color:#e8a080;margin-top:8px}
.dval{position:absolute;transform:translate(-50%,-50%);font-size:26px;color:var(--bone);text-shadow:3px 3px 0 #000;pointer-events:none;animation:dpop .35s cubic-bezier(.3,1.8,.6,1)}
.dval.crit{color:#ffd27a;font-size:32px} .dval.bad{color:#e07060}
@keyframes dpop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.die{background:var(--dc,var(--bone))}
.die.owned{outline:3px solid var(--teal2);outline-offset:-3px;background:var(--dc,var(--bone))}
#tray.pop .die{animation:traypop .4s cubic-bezier(.3,1.7,.6,1) backwards}
#tray.pop .die:nth-child(2){animation-delay:.05s} #tray.pop .die:nth-child(3){animation-delay:.1s} #tray.pop .die:nth-child(4){animation-delay:.15s} #tray.pop .die:nth-child(5){animation-delay:.2s} #tray.pop .die:nth-child(6){animation-delay:.25s}
@keyframes traypop{from{transform:translateY(-60px) scale(.4) rotate(-40deg);opacity:0}}
.pchips{margin-top:8px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.pchip{font-family:var(--px);font-size:10px;padding:6px 8px;background:var(--dc);color:var(--ink);border:3px solid rgba(255,255,255,.5);cursor:pointer;transition:transform .1s}
.pchip.on{outline:3px solid var(--amber);transform:translateY(-3px)}
@media (max-width:900px), (orientation:portrait){
 #unitPanel{width:190px;font-size:7px;line-height:1.6;padding:8px}
 #unitPanel .weap,#unitPanel .perk{display:none}
 #unitPanel .portrait{width:32px;height:40px}
 #actions{max-height:calc(100% - 420px);min-width:200px}
 #actions .btn{padding:7px 9px;font-size:9px}
}
@media (max-width:760px){
 #unitPanel{width:210px;top:48px}
 .die{width:46px;height:46px;font-size:16px}
 #tileInfo{bottom:78px}
 #hint{max-width:200px;font-size:8px}
 #actions{bottom:78px;min-width:190px}
 .hgrid{grid-template-columns:1fr 1fr}
 .tabs .descend{margin-left:0}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div id="pops"></div>
 <div id="top">
  <div id="turnLabel"></div>
  <div id="topright">
   <button class="btn" id="rollBtn" aria-label="Toggle flick or auto dice rolling">Roll: Flick</button>
   <button class="btn" id="threatBtn" aria-label="Show enemy threat range">Threat</button>
   <button class="btn" id="rotL" aria-label="Rotate camera left">&#10226;</button>
   <button class="btn" id="rotR" aria-label="Rotate camera right">&#10227;</button>
   <button class="btn" id="muteBtn" aria-label="Toggle sound">Snd</button>
  </div>
 </div>
 <div class="bonly" id="hint"></div>
 <div id="unitPanel" class="panel"></div>
 <div id="actions" class="panel"></div>
 <div id="forecast" class="panel"></div>
 <div id="tileInfo" class="panel"></div>
 <div id="tray"></div>
 <div id="banner"></div>
 <div id="d20"></div><div id="d20label"></div>
</div>
<div id="screen"></div>
<div id="diceLayer"><canvas id="diceCv"></canvas><div id="diceTitle"></div><div id="diceResult"></div><div id="dicePrompt"></div></div>
<div id="modal"><div class="panel" id="modalBody"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/HorizontalTiltShiftShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VerticalTiltShiftShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
